# Lake package for the repository's Lean (theorem proving) sources.
#
# The library is rooted at `src/theorems`; its root module `Theorems.lean`
# imports every submodule so `lake build` covers the whole library. The pinned
# Lean version lives in `lean-toolchain`, and exact dependency revisions are
# recorded in `lake-manifest.json` (generated by `just lean-update`).
name = "theorems"
defaultTargets = ["Theorems"]

# Options applied to every module in this package. These enforce the project's
# Lean conventions at the compiler level: automatic implicits are disabled so a
# typo becomes an error rather than a new parameter, and anonymous functions are
# pretty-printed with `fun a ↦ b`.
[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
pp.unicode.fun = true

# Mathlib supplies both the mathematical library and the conventions this
# project follows. `stable` tracks the latest stable Lean release series; run
# `just lean-update` to resolve it to an exact revision and fetch the build
# cache.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "stable"

[[lean_lib]]
name = "Theorems"
srcDir = "src/theorems"
